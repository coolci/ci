name: ovh-buy

services:
  postgres:
    image: postgres:15-alpine
    container_name: ovh-buy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ovhbuy}
      POSTGRES_USER: ${POSTGRES_USER:-ovhbuy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: ovh-buy-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  backend:
    build: ./backend
    container_name: ovh-buy-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-ovhbuy} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-ovhbuy} port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "168h"
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      RATE_LIMIT_PER_MIN: "120"
      LOG_LEVEL: info
    networks: [internal]

  frontend:
    build: .
    container_name: ovh-buy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    networks: [internal]

volumes:
  pg_data:
  redis_data:

networks:
  internal:
    driver: bridge
